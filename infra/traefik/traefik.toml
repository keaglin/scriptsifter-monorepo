[entryPoints]
  [entryPoints.web]
    address = ":80"
    [entryPoints.web.http.redirections.entryPoint]
      to = "websecure"
      scheme = "https"

  [entryPoints.websecure]
    address = ":443"

[api]
  dashboard = true

[providers]
  [providers.docker]
    exposedByDefault = false
    watch = true
    network = "services"

[certificatesResolvers]
  [certificatesResolvers.letsencrypt]
    [certificatesResolvers.letsencrypt.acme]
      email = "dev@keaglin.com"
      storage = "acme.json"  # File for storing certificates
      [certificatesResolvers.letsencrypt.acme.tlsChallenge] # TLS challenge configuration
        entryPoint = "websecure"

[providers.file]
  filename = "traefik_dynamic.toml"
