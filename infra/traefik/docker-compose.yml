services:
  traefik:
    image: traefik:v3.0 # Adjust version if needed
    container_name: traefik # Optional, but helps with `docker ps`
    restart: always # Recommended for production
    security_opt:
      - no-new-privileges=true
    read_only: true
    # command:
    # - "--api.dashboard=true"
    # - "--providers.docker=true"
    # - "--providers.docker.exposedbydefault=false"
    # - "--providers.docker.network=services"
    # - "--entrypoints.web.address=:80"
    # - "--entrypoints.websecure.address=:443"
    # - "--certificateresolvers.letsencrypt"
    # - "--certificatesresolvers.letsencrypt.acme.email=dev@keaglin.com"
    # - "--certificatesresolvers.letsencrypt.acme.storage=acme.json"
    # # used during the challenge
    # - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./letsencrypt:/letsencrypt"
      - ./traefik.toml:/traefik.toml
      - ./traefik_dynamic.toml:/traefik_dynamic.toml
      - ./acme.json:/acme.json
    networks:
      - inet
