services:
  traefik:
    image: traefik:v3.0 # Adjust version if needed
    container_name: traefik # Optional, but helps with `docker ps`
    restart: always # Recommended for production
    security_opt:
      - no-new-privileges=true
    read_only: true
    command:
      - "--log.level=DEBUG"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.email=dev@keaglin.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - ./letsencrypt/acme.json:/letsencrypt/acme.json:rw
    networks:
      - inet
    labels:
      - "traefik.enable=true"
      - traefik.http.routers.api.rule=Host(`traefik.scriptsifter.com`)
      - traefik.http.routers.api.service=api@internal
      - "traefik.http.routers.traefik-secure.tls.domains.main=scriptsifter.com" #if you use the .home.yourdomain.co.uk entry you have to change the [0] into [1]
      - "traefik.http.routers.traefik-secure.tls.domains.sans=*.scriptsifter.com"

networks:
  inet:
    external: true
