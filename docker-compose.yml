services:
  traefik:
    image: traefik:v3.0 # Adjust version if needed
    container_name: traefik # Optional, but helps with management
    restart: always # Recommended for production
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "./traefik.toml:/etc/traefik/traefik.toml:ro"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./letsencrypt:/letsencrypt"

  web:
    image: kevonstaycoding/scriptsifter-web:latest
    ports:
      - "80:3000" # Map your frontend's port
    depends_on:
      - transcribe
      - goldmine
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`app.scriptsifter.com`)"
      - "traefik.http.routers.web.entrypoints=websecure"  # HTTPS entrypoint
      - "traefik.http.routers.web.tls=true" # Enforce TLS


  transcribe:
    image: kevonstaycoding/scriptsifter-transcribe:latest
    volumes:
    - transcribe-data:/data # Storage for downloaded files
    depends_on:
      - kafka

  goldmine:
    image: kevonstaycoding/scriptsifter-goldmine:latest
    depends_on:
      - kafka

  kafka:
    image: bitnami/kafka:latest
    environment:
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092 # Adjust if needed
    ports:
      - "9092:9092"

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000" # MinIO's default port
    volumes:
      - minio-data:/data # Persist MinIO's data
    command: server /data

  postgres:
    image: postgres:latest
    environment:
      - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
    volumes:
      - postgres-data:/var/lib/postgresql/data  # Persist Postgres data

volumes:
  minio-data:
  postgres-data:
  transcribe-data:
