services:
  web:
    image: kevonstaycoding/scriptsifter-web:latest
    ports:
      - "80:3000" # Map your frontend's port
    depends_on:
      - transcribe
      - goldmine

  transcribe:
    image: kevonstaycoding/scriptsifter-transcribe:latest
    volumes:
    - transcribe-data:/data # Storage for downloaded files
    depends_on:
      - kafka

  goldmine:
    image: kevonstaycoding/scriptsifter-goldmine:latest
    depends_on:
      - kafka

  kafka:
    image: bitnami/kafka:latest
    environment:
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092 # Adjust if needed
    ports:
      - "9092:9092"

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000" # MinIO's default port
    volumes:
      - minio-data:/data # Persist MinIO's data
    command: server /data

  postgres:
    image: postgres:latest
    environment:
      - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
    volumes:
      - postgres-data:/var/lib/postgresql/data  # Persist Postgres data

volumes:
  minio-data:
  postgres-data:
  transcribe-data:
    driver_opts:
      size: 5GB
